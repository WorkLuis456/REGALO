<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter', sans-serif;
  background: linear-gradient(135deg,#1e1e2f,#ff6b8a);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  color:white;
}

/* TITULO */
.title{
  font-family:'Dancing Script', cursive;
  font-size:30px;
  margin-bottom:18px;
}

/* GRID */
.wrapper{
  display:grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  gap:14px;
  width:95%;
  max-width:460px;
}

/* CAPSULAS */
.box{
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:14px;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  height:230px;
  box-shadow:0 12px 30px rgba(0,0,0,.3);
}

/* 💖 NOTA */
.note{
  font-family:'Dancing Script', cursive;
  font-size:15px;
  text-align:center;
  line-height:1.5;
}

/* LATIDO */
.heartbeat{
  animation:beat 1s infinite;
}
@keyframes beat{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.08);}
}

/* PLAYER */
.cover{
  width:100%;
  border-radius:12px;
}

.song{font-weight:600;margin-top:6px;}
.artist{font-size:12px;opacity:.7;}

.progress{
  height:5px;
  background:rgba(255,255,255,.2);
  border-radius:10px;
  margin:8px 0;
  overflow:hidden;
  width:100%;
}

.bar{
  height:100%;
  width:0%;
  background:#ff6b8a;
}

/* BARRAS AUDIO */
.equalizer{
  display:flex;
  gap:3px;
  margin:6px 0;
}

.eq{
  width:4px;
  height:10px;
  background:#ff6b8a;
  animation:jump 1s infinite;
}

.eq:nth-child(2){animation-delay:.2s;}
.eq:nth-child(3){animation-delay:.4s;}
.eq:nth-child(4){animation-delay:.3s;}

@keyframes jump{
  0%,100%{height:8px;}
  50%{height:18px;}
}

/* BOTON */
.btn{
  background:#ff6b8a;
  border:none;
  color:white;
  width:45px;
  height:45px;
  border-radius:50%;
}

/* 💿 VINILO */
.vinyl-wrap{
  position:relative;
}

.vinyl{
  width:110px;
  height:110px;
  border-radius:50%;
  background:
    radial-gradient(circle at center,#222 10%,#000 60%),
    repeating-radial-gradient(circle,#111 0px,#111 2px,#000 3px);
  box-shadow:0 10px 25px rgba(0,0,0,.7);
}

/* CENTRO */
.vinyl::after{
  content:"";
  position:absolute;
  width:28px;
  height:28px;
  background:#ff6b8a;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* GIRAR */
.spin{
  animation:spin 4s linear infinite;
}
@keyframes spin{
  from{transform:rotate(0);}
  to{transform:rotate(360deg);}
}

/* 🎯 AGUJA */
.arm{
  position:absolute;
  width:80px;
  height:4px;
  background:#ccc;
  top:-10px;
  left:60px;
  transform-origin:left;
  transform:rotate(-20deg);
  transition:.5s;
}

.arm.active{
  transform:rotate(10deg);
}

/* CORAZONES */
.heart{
  position:fixed;
  top:-20px;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh); opacity:0;}
}
</style>
</head>

<body>

<div class="title">Nuestra canción 💖</div>

<div class="wrapper">

  <!-- 💖 NOTA -->
  <div class="box note heartbeat">
    Esta canción es muy importante para mí… 🥰<br>
    tú me la dedicaste amor 🥺<br>
    y acordamos que sería nuestra…<br><br>
    <b>TE AMO MUCHO 💖</b>
  </div>

  <!-- 🎵 PLAYER -->
  <div class="box">
    <img class="cover" src="https://cdn-p.smehost.net/sites/a8928da38df6414aae98564041b07ae0/wp-content/uploads/2016/09/Siddhartha-unicos.jpg">

    <div class="song">Únicos 💖</div>
    <div class="artist">Siddhartha</div>

    <audio id="audio">
      <source src="08 Únicos.mp3" type="audio/mpeg">
    </audio>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <!-- 🎧 BARRAS -->
    <div class="equalizer" id="eq">
      <div class="eq"></div>
      <div class="eq"></div>
      <div class="eq"></div>
      <div class="eq"></div>
    </div>

    <button class="btn" onclick="toggle()">▶</button>
  </div>

  <!-- 💿 VINILO REAL -->
  <div class="box">
    <div class="vinyl-wrap">
      <div class="arm" id="arm"></div>
      <div class="vinyl" id="vinyl"></div>
    </div>
  </div>

</div>

<script>
const audio = document.getElementById("audio");
const bar = document.getElementById("bar");
const vinyl = document.getElementById("vinyl");
const arm = document.getElementById("arm");
const eq = document.getElementById("eq");

function toggle(){
  if(audio.paused){
    audio.play();
    vinyl.classList.add("spin");
    arm.classList.add("active");
    eq.style.opacity=1;
  }else{
    audio.pause();
    vinyl.classList.remove("spin");
    arm.classList.remove("active");
    eq.style.opacity=0.3;
  }
}

/* PROGRESO */
audio.addEventListener("timeupdate", ()=>{
  const percent = (audio.currentTime / audio.duration) * 100;
  bar.style.width = percent + "%";
});

/* corazones */
setInterval(()=>{
 let h=document.createElement("div");
 h.className="heart";
 h.innerText=Math.random()>0.5?"💖":"💗";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(Math.random()*3+3)+"s";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
},800);
</script>

</body>
</html>
