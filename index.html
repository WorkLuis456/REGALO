<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Keren 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@500;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
:root{
  --card:rgba(255,255,255,.08);
  --accent:#ff6b8a;
  --yes:#6ddf8b;
}

/* 🌌 FONDO CINE ROMÁNTICO */
body{
  margin:0;
  font-family:'Inter', sans-serif;
  background: radial-gradient(circle at top,#2a2a40,#0d0d18);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
}

/* ✨ ESTRELLAS */
.stars{
  position:fixed;
  inset:0;
  z-index:-1;
}
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  opacity:.7;
  animation:twinkle 3s infinite alternate;
}
@keyframes twinkle{
  from{opacity:.2;}
  to{opacity:1;}
}

/* 💳 CARD */
.card{
  width:92%;
  max-width:420px;
  padding:30px 22px;
  border-radius:28px;
  background:var(--card);
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 60px rgba(0,0,0,.5);
  text-align:center;
  animation:fadeIn .8s ease;
  border:1px solid rgba(255,255,255,.15);
}

/* ✨ BRILLO SUAVE */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:28px;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,.15), transparent);
  pointer-events:none;
}

/* 📝 TEXTO */
.title{
  font-family:'Poppins', sans-serif;
  font-size:26px;
  font-weight:700;
}

.subtitle{
  font-size:14px;
  opacity:.85;
  margin-top:4px;
}

.question{
  font-family:'Dancing Script', cursive;
  font-size:26px;
  margin-top:10px;
}

/* 🐱 GATITO */
.cat{
  font-size:70px;
  margin:14px 0;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}

/* BOTONES */
.controls{
  position:relative;
  height:140px;
  margin-top:10px;
}

button{
  padding:14px 26px;
  border:none;
  border-radius:16px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
}

#yes{
  position:absolute;
  left:50%;
  top:10px;
  transform:translateX(-50%);
  background:linear-gradient(180deg,#8ff0a4,var(--yes));
  color:white;
}

#yes:hover{
  transform:translateX(-50%) scale(1.06);
}

#no{
  position:absolute;
  left:50%;
  top:75px;
  transform:translateX(-50%);
  background:linear-gradient(180deg,#ff7c9c,var(--accent));
  color:white;
}

/* MENSAJE */
#textoNo{
  margin-top:18px;
  font-size:14px;
  min-height:42px;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
}

/* ANIMACIONES */
.fade-out{
  animation:fadeOut .5s forwards;
}
@keyframes fadeOut{
  to{opacity:0; transform:scale(.95);}
}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
}

/* 💖 CORAZONES */
.heart{
  position:fixed;
  top:-20px;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh); opacity:0;}
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="card">

<h1 class="title">Oye AMOR… 💖</h1>

<div id="cat" class="cat">🐱💞</div>

<p class="subtitle">Hay algo que quiero preguntarte…</p>

<h2 class="question">¿Me quieres? 🥺</h2>

<div class="controls" id="controls">
  <button id="yes" onclick="aceptar()">SÍ 💕</button>
  <button id="no">NO 🙈</button>
</div>

<div id="textoNo"></div>

</div>

<script>
let intentos=0;
let moving=false;

const frases=[
"¿Lo dices enserio? 🥺",
"Mmm… no te creo 😦",
"Esa respuesta no me convence... 💭",
"Creo que solo te haces la difícil ehh 🫢",
"Tu mirada dice otra cosa jsjsjsk 💖",
"Ya casi dices que si yo lo se",
"Solo falta que lo admitas mi amor💞",
"Ok… ya no hay escapatoria 😏"];

const noBtn=document.getElementById("no");
const cat=document.getElementById("cat");

function moverNo(){
 if(moving)return;

 if(intentos>=8){
  noBtn.style.display="none";
  document.getElementById("textoNo").innerText="ya no te dejo decir que no 🫠";
  return;
 }

 moving=true;

 const area=document.getElementById("controls");
 const maxX=area.clientWidth - noBtn.offsetWidth;
 const maxY=area.clientHeight - noBtn.offsetHeight;

 const x=Math.random()*maxX;
 const y=Math.random()*(maxY-20)+20;

 noBtn.style.left=x+"px";
 noBtn.style.top=y+"px";
 noBtn.style.transform="none";

 document.getElementById("textoNo").innerText=frases[intentos];

 cat.innerText="🐱💔";

 intentos++;

 setTimeout(()=>{
  cat.innerText="🐱💞";
  moving=false;
 },500);
}

noBtn.onclick=moverNo;
noBtn.ontouchstart=(e)=>{e.preventDefault(); moverNo();};

function aceptar(){
 cat.innerText="🐱🤗💞";

 document.getElementById("textoNo").innerText=
 "Por decir que sí… elige un regalito mi niña hermosa 💖";

 setTimeout(()=>{
   document.querySelector(".card").classList.add("fade-out");

   setTimeout(()=>{
     window.location.href="regalos.html";
   },500);

 },1800);
}

/* ✨ estrellas */
const stars=document.getElementById("stars");
for(let i=0;i<60;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"%";
 s.style.top=Math.random()*100+"%";
 stars.appendChild(s);
}

/* 💖 corazones */
setInterval(()=>{
 let h=document.createElement("div");
 h.className="heart";
 h.innerText=Math.random()>0.5?"💖":"💗";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(Math.random()*3+3)+"s";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
},700);
</script>

</body>
</html>
